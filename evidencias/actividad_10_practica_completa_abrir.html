<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividad 10 · Ejercicio completo de JavaScript</title>
<style>
/* Actividad 10: pegar en el panel CSS de CodePen */
body { margin: 0; padding: 30px; background: #ecf6f3; font-family: Arial, sans-serif; color: #1b3141; }
.actividad10 { max-width: 590px; margin: 30px auto; background: white; padding: 26px; border: 2px solid #80c9b2; border-radius: 16px; box-shadow: 0 10px 30px #1b31411a; }
.actividad10 h1 { margin: 0 0 15px; }
.actividad10-etiqueta { color: #087e83; font-weight: bold; }
.actividad10 li { padding: 7px 0; }
#inscripciones-total { margin: 18px 0 0; padding: 15px; background: #d8f2ed; color: #06656b; font-size: 20px; font-weight: bold; border-radius: 8px; }
@media (max-width: 640px) { body { padding: 12px; } .actividad10 { padding: 18px; margin: 12px auto; } }

</style>
</head>
<body>
<section class="actividad10" aria-labelledby="a10-titulo">
  <p class="actividad10-etiqueta">Actividad 10 · JavaScript</p>
  <h1 id="a10-titulo">Lista de inscritos</h1>
  <p>Práctica con tres participantes ficticios.</p>
  <ul id="inscripciones-lista"></ul>
  <p id="inscripciones-total" role="status" aria-live="polite"></p>
</section>

<p style="text-align:center;color:#587180;font-size:13px">Ejercicio local para practicar el código de los paneles de CodePen. No es una publicación de CodePen.</p>
<script>
// Actividad 10: pegar en el panel JavaScript de CodePen
// Datos ficticios de participantes.
const inscripciones = ["Ana López", "Luis Pérez", "Marta García"];

// La función devuelve la cantidad de nombres del arreglo.
function contarInscripciones() {
  return inscripciones.length;
}

// Muestra los nombres sin insertarlos como HTML inseguro.
const listaInscripciones = document.querySelector("#inscripciones-lista");
inscripciones.forEach((nombre) => {
  const item = document.createElement("li");
  item.textContent = nombre;
  listaInscripciones.appendChild(item);
});

// Coloca el resultado en un párrafo del documento.
const parrafoTotal = document.querySelector("#inscripciones-total");
parrafoTotal.textContent = `Total de inscripciones: ${contarInscripciones()}`;

</script>
</body>
</html>
